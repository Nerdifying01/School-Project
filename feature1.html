<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Party Of The New Age</title>
</head>
<body class="theme-yellow">

    <!-- Theme Switcher -->
    <div class="theme-switcher">
        <p>Theme</p>
        <button class="theme-btn active" data-theme="yellow" style="background:#f1c40f;" title="Yellow"></button>
        <button class="theme-btn" data-theme="blue" style="background:#3498db;" title="Blue"></button>
        <button class="theme-btn" data-theme="red" style="background:#e74c3c;" title="Red"></button>
        <button class="theme-btn" data-theme="green" style="background:#2ecc71;" title="Green"></button>
    </div>

    <!-- Header -->
    <header class="page-header">
        <div class="banner-area">
            <img src="images/Logo.png" alt="Nerdify Banner" class="banner-img">
        </div>
        <nav class="page-nav">
            <a href="index.html">Home</a>
            <a href="goober.html">About</a>
            <a href="goober.html">Community</a>
            <a href="goober.html">Resources</a>
            <a href="goober.html">Contact Us</a>
        </nav>
    </header>

    <!-- ========== MAIN CONTENT ========== -->
    <main class="page-content">
        <div class="content-layout">
            
            <!-- Left side: text stacked -->
            <div class="text-column">
                <h1 class="page-title">NAME</h1>
                <h2 class="feature-title">SECTION TITLE</h2>
                <p class="main-text">
                    Main text that sits beside the image. Use this for the key
                    point of the section. Bla bla bla.
                </p>
            </div>

            <!-- Right side: image + caption -->
            <div class="image-column">
                <img src="images/feature.png" alt="Describe the image here" class="feature-img">
                <p class="feature-note">Picture of Duncan.</p>
            </div>

        </div>
    </main>

    <!-- Theme script -->
    <script>
        const buttons = document.querySelectorAll('.theme-btn');
        const body = document.body;
        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                body.classList.remove('theme-yellow', 'theme-blue', 'theme-red', 'theme-green');
                body.classList.add('theme-' + btn.dataset.theme);
                buttons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });
    </script>
</body>
</html>
