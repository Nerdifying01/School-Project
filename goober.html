<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Coming Soon - Nerdify</title>
</head>

<body class="theme-yellow">

    <!-- Theme Switcher -->
    <div class="theme-switcher">
        <p>Theme</p>
        <button class="theme-btn active" data-theme="yellow" style="background:#f1c40f;" title="Yellow"></button>
        <button class="theme-btn" data-theme="blue" style="background:#3498db;" title="Blue"></button>
        <button class="theme-btn" data-theme="red" style="background:#e74c3c;" title="Red"></button>
        <button class="theme-btn" data-theme="green" style="background:#2ecc71;" title="Green"></button>
    </div>

    <!-- Header with Banner -->
    <header class="page-header">
        <div class="banner-area">
            <img src="images/Logo.png" alt="Nerdify Banner" class="banner-img">
        </div>

        <nav class="page-nav">
            <a href="index.html">Home</a>
            <a href="goober.html">About</a>
            <a href="goober.html">Community</a>
            <a href="goober.html">Resources</a>
            <a href="goober.html">Contact Us</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main style="max-width: 800px; margin: 4rem auto; text-align: center; padding: 0 1.5rem;">
        <h1 style="font-size: 2.5rem; color: var(--accent); margin-bottom: 1rem;">Coming Soon</h1>
        <p style="font-size: 1.2rem; color: #bbb;">
            This page is still under construction.<br>
            Check back later!
        </p>
    </main>

    <footer class="footer">
        <p>&copy; This page is created by Aaron</p>
    </footer>

    <script>
        const buttons = document.querySelectorAll('.theme-btn');
        const body = document.body;

        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                body.classList.remove('theme-yellow', 'theme-blue', 'theme-red', 'theme-green');
                body.classList.add('theme-' + btn.dataset.theme);
                buttons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });
    </script>

</body>
</html>
