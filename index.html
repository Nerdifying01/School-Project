<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Party Of The New Age</title>
</head>

<body class="theme-yellow">

    <!-- Theme Switcher (fixed on the right) -->
    <div class="theme-switcher">
        <p>Theme</p>
        <button class="theme-btn active" data-theme="yellow" style="background:#f1c40f;" title="Yellow"></button>
        <button class="theme-btn" data-theme="blue" style="background:#3498db;" title="Blue"></button>
        <button class="theme-btn" data-theme="red" style="background:#e74c3c;" title="Red"></button>
        <button class="theme-btn" data-theme="green" style="background:#2ecc71;" title="Green"></button>
    </div>

    <!-- Top Header -->
    <header class="top-header">
        <div class="logo-area">
            <img src="images/Logo.png" alt="Nerdify Logo" class="logo-img">
            <div class="logo-text">
                <h1>Party Of The New Age</h1>
                <p>Justice is our path to growth.
            </div>
        </div>

        <nav class="main-nav">
            <a href="goober.html">About</a>
            <a href="goober.html">Community</a>
            <a href="goober.html">Resources</a>
            <a href="goober.html">Contact Us</a>
        </nav>
    </header>


    <!-- Features Section -->
    <section class="features">
        <div class="section-header">
            <h2>Meet our staff</h2>
            <span class="info"</span>
        </div>

        <div class="feature-grid">

            <!-- Feature Card 1 -->
            <a href="feature1.html" class="feature-card-link">
                <div class="feature-card">
                    <div class="feature-label">TITLE</div>
                    <h3 class="feature-title">THERE JOB</h3>
                    <p class="feature-author">AUTHOR</p>
                    <p class="feature-desc">EXTRA INFO</p>
                    <div class="feature-footer"></div>
                </div>
            </a>

        </div>
    </section>

    <!-- Resources Section -->
    <section class="topic">
        <div class="topic-title">
            <h1>Resources</h1>
        </div>
        <div class="topic-content">

            <a href="goober.html" class="topic-card-link">
                <div class="topic-card">
                    <img src="images/placeholder-1024x1024.png" alt="Resource 1">
                    <h2 class="topic-card-text">Policy 1</h2>
                </div>
            </a>

            <a href="goober.html" class="topic-card-link">
                <div class="topic-card">
                    <img src="images/placeholder-1024x1024.png" alt="Resource 2">
                    <h2 class="topic-card-text">Policy 2</h2>
                </div>
            </a>

            <a href="v.html" class="topic-card-link">
                <div class="topic-card">
                    <img src="images/placeholder-1024x1024.png" alt="Nerdify Vault">
                    <h2 class="topic-card-text">Policy 3</h2>
                </div>
            </a>

        </div>
    </section>

   
    

</body>
</html>
